name: Test and package

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.8", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install and check all templates
        run: |
          python -m pip install -e . build
          python -m unittest discover -s tests -v
      - name: Build and install wheel
        run: |
          python -m build
          python -m pip install --force-reinstall --no-deps dist/*.whl
          python -m pip check
      - name: Run installed CLI outside the checkout
        run: |
          cp examples/product-brief.json "$RUNNER_TEMP/product-brief.json"
          cd "$RUNNER_TEMP"
          prettyppt generate -i product-brief.json -o product
          prettyppt prompt > agent-prompt.txt
          python -c "from pathlib import Path; import prettyppt; assert len(prettyppt.list_templates()) == 80; assert (Path(prettyppt.__file__).parent / 'viewers/gallery.html').is_file()"
